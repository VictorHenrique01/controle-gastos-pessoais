<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="/static/style_inicial.css">
</head>
<body>
    <div class="container">
        <div class="image-side">
            <img src="/static/img/finance.png" alt="Controle de Gastos">
        </div>

        <div class="content-side">
            <h1>Controle de Gastos</h1>
            <p>Organize seu dinheiro, conquiste seus objetivos.</p>

            <div class="buttons">
                <a href="/usuarios/cadastro" class="btn btn-primary">Cadastrar-se</a>
                
                <a href="/usuarios/login" class="btn btn-secondary">Entrar</a>
            </div>

            {% if session.get('usuario_id') %}
            <div id="controle-despesas-wrapper">
                <a href="/pagina_inicial" class="btn-controlar-despesas">Controlar Despesas</a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
