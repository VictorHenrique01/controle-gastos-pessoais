<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link rel="stylesheet" href="/static/style_inicial.css">
</head>
<body>
    <div class="container">
        <!-- img -->
        <div class="image-side">
            <img src="/image/finance.png" alt="Controle de Gastos">
        </div>

        <!-- conteúdo -->
        <div class="content-side">
            <h1>Controle de Gastos</h1>
            <p>Organize seu dinheiro, conquiste seus objetivos.</p>

            <div class="buttons">
                <a href="/templates/cadastro_usuario.html" class="btn btn-primary">Cadastrar-se</a>
                <a href="/templates/login.html" class="btn btn-secondary">Entrar</a>
            </div>

            <!-- botão que aparece após login -->
            <div id="controle-despesas-wrapper" style="display: none;">
                <a href="/templates/despesas.html" class="btn-controlar-despesas">Controlar Despesas</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const wrapper = document.getElementById("controle-despesas-wrapper");
            const logado = localStorage.getItem("usuarioLogado") === "true";

            // mostra o botão se o usuário estiver logado
            if (logado) {
                wrapper.style.display = "block";
            }
        });
    </script>
</body>
</html>
