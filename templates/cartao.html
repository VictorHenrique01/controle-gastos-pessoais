<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcelamentos — Controle de Gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/cartao.css">
</head>
<body>

    <!-- NAV -->
    <nav class="topnav">
        <!-- ✅ Corrigido: rota Flask em vez de caminho de arquivo físico -->
        <a href="/pagina_inicial" class="nav-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Despesas
        </a>
        <span class="nav-title">Parcelamentos</span>
        <button id="btnNovaCompra" class="btn-nova-compra">+ Nova compra</button>
    </nav>

    <!-- CARDS DE RESUMO -->
    <section class="resumo-cards">

        <div class="card-resumo card-azul">
            <div class="card-resumo-top">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                    <line x1="1" y1="10" x2="23" y2="10"/>
                </svg>
                <span class="card-badge">Este mês</span>
            </div>
            <div class="card-resumo-valor" id="totalMes">R$ 0,00</div>
            <div class="card-resumo-label">Total comprometido/mês</div>
        </div>

        <div class="card-resumo card-roxo">
            <div class="card-resumo-top">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <span class="card-badge" id="totalAtivos">0 ativos</span>
            </div>
            <div class="card-resumo-valor" id="totalParcelamentos">R$ 0,00</div>
            <div class="card-resumo-label">Em parcelamentos</div>
        </div>

        <div class="card-resumo card-verde">
            <div class="card-resumo-top">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                    <polyline points="17 6 23 6 23 12"/>
                </svg>
                <span class="card-badge" id="proximoMesLabel">Próximo mês</span>
            </div>
            <div class="card-resumo-valor" id="totalProximoMes">R$ 0,00</div>
            <div class="card-resumo-label">Impacto próximo mês</div>
        </div>

    </section>

    <!-- LISTA DE PARCELAMENTOS -->
    <section class="parcelamentos-section">

        <div class="section-header">
            <h2>Parcelamentos ativos</h2>
            <span class="section-count" id="countAtivos">0 compras</span>
        </div>

        <div id="lista-parcelamentos" class="lista-cards">
            <!-- Cards gerados via JS -->
        </div>

        <p id="msg-vazia" class="msg-vazia">
            Nenhum parcelamento ativo. Clique em <strong>+ Nova compra</strong> para começar.
        </p>

    </section>

    <!-- MODAL: NOVA COMPRA -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Registrar compra parcelada</h3>
                <button id="btnFecharModal" class="btn-fechar">✕</button>
            </div>

            <form id="form-cartao" novalidate>

                <div class="form-group">
                    <label for="fc-descricao">Descrição</label>
                    <input type="text" id="fc-descricao" placeholder="Ex: iPhone 15, Notebook..." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fc-valor">Valor total (R$)</label>
                        <input type="number" id="fc-valor" placeholder="0,00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="fc-parcelas">Nº de parcelas</label>
                        <select id="fc-parcelas" required>
                            <option value="">—</option>
                            <option value="1">1x (à vista)</option>
                            <option value="2">2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                            <option value="6">6x</option>
                            <option value="7">7x</option>
                            <option value="8">8x</option>
                            <option value="9">9x</option>
                            <option value="10">10x</option>
                            <option value="11">11x</option>
                            <option value="12">12x</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fc-categoria">Categoria</label>
                        <select id="fc-categoria" required>
                            <option value="">Selecione</option>
                            <option value="alimentacao">Alimentação</option>
                            <option value="transporte">Transporte</option>
                            <option value="lazer">Lazer</option>
                            <option value="moradia">Moradia</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fc-data-compra">Data da compra</label>
                        <input type="date" id="fc-data-compra" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fc-dia-vencimento">Dia de vencimento da fatura</label>
                    <input type="number" id="fc-dia-vencimento" placeholder="Ex: 10" min="1" max="28" required>
                    <span class="form-hint">Entre 1 e 28</span>
                </div>

                <!-- Preview de parcelas -->
                <div id="fc-preview" class="fc-preview hidden">
                    <span class="fc-preview-label">Parcelas</span>
                    <div id="fc-preview-valor" class="fc-preview-valor"></div>
                </div>

                <p id="form-erro" class="form-erro hidden"></p>

                <div class="form-acoes">
                    <button type="button" id="btnCancelarModal" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Salvar compra</button>
                </div>

            </form>
        </div>
    </div>

    <script src="/static/js/cartao.js"></script>

    <script>
        document.getElementById("btnNovaCompra").addEventListener("click", () => {
            document.getElementById("modal-overlay").classList.remove("hidden");
        });
        document.getElementById("btnFecharModal").addEventListener("click", () => {
            document.getElementById("modal-overlay").classList.add("hidden");
        });
        document.getElementById("btnCancelarModal").addEventListener("click", () => {
            document.getElementById("modal-overlay").classList.add("hidden");
        });
        document.getElementById("modal-overlay").addEventListener("click", (e) => {
            if (e.target === e.currentTarget) e.currentTarget.classList.add("hidden");
        });
    </script>

</body>
</html>
